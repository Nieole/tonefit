name: Quality

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: Exact tagged commit to rebuild and verify
        required: true
        type: string

permissions:
  contents: read

# No shared Cargo/native cache: PR outputs must never seed trusted delivery builds.
jobs:
  native-quality:
    name: Quality (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.98.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.commit || github.sha }}
        run: |
          python -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}", os.environ["EXPECTED_SHA"])'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - name: Verify native host
        run: python scripts/ci/native.py host --target '${{ matrix.target }}'
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt,rust-docs
          rustc -vV
          cargo -V
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Linux native tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config nasm
      - name: macOS native tools
        if: runner.os == 'macOS'
        run: brew install nasm pkgconf
      - name: Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm pkgconfiglite --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Meson and Ninja
        run: python -m pip install meson==1.9.1 ninja==1.13.0
      - name: Helper and workflow contract tests
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s scripts/ci/tests -v
      - name: Static dav1d
        run: >-
          python scripts/ci/native.py build --target '${{ matrix.target }}'
          --work "$RUNNER_TEMP/tonefit-native" --github-env "$GITHUB_ENV"
      - name: Record native provenance
        run: cat "$RUNNER_TEMP/tonefit-native/provenance.json" >> "$GITHUB_STEP_SUMMARY"
      # Spell out the xtask alias so the dispatcher's own build is locked too.
      - name: Three build gates
        run: cargo run --locked --quiet --package xtask -- gate
      - name: Polish
        run: cargo run --locked --quiet --package xtask -- polish
      - name: Design acceptance
        working-directory: .scratch/session-redesign
        run: |
          npm ci
          npm run check
          npm test
      - name: Release binary
        run: cargo build --locked --release --target '${{ matrix.target }}' --message-format=json-render-diagnostics > "$RUNNER_TEMP/tonefit-release.json"
      - name: Deterministic package fixtures
        env:
          TONEFIT_PACKAGE_FIXTURES: ${{ runner.temp }}/tonefit-package-fixtures
        run: cargo test --locked --test package
      - name: Package, audit and extracted-archive smoke
        run: |
          binary="target/${{ matrix.target }}/release/tonefit"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/ci/package.py --target '${{ matrix.target }}' \
            --binary "$binary" --native-work "$RUNNER_TEMP/tonefit-native" \
            --build-messages "$RUNNER_TEMP/tonefit-release.json" \
            --fixtures "$RUNNER_TEMP/tonefit-package-fixtures" --output dist
      - name: Upload verified package and audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tonefit-${{ matrix.target }}-${{ inputs.commit || github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          # Full-run retries replace only this run's temporary package artifacts.
          overwrite: true

  quality-success:
    name: All required quality checks
    if: always()
    needs: [native-quality]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix job to succeed
        env:
          QUALITY_RESULT: ${{ needs.native-quality.result }}
        run: test "$QUALITY_RESULT" = success
