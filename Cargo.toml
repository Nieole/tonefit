[package]
name = "tonefit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
fast_image_resize = "6"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp", "rayon", "avif-native"] }
indicatif = "0.18.6"
lz4_flex = "0.14.0"
num_cpus = "1.17.0"
png = "0.18.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssimulacra2 = { version = "0.5.1", optional = true }
thiserror = "2.0.20"
toml = "1.1.4"
walkdir = "2.5.0"
zip = "8"

[features]
ssimulacra2 = ["dep:ssimulacra2"]
