[package]
name = "tonefit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
encoding_rs = "0.8.35"
fast_image_resize = "6"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp", "rayon", "avif-native"] }
indicatif = "0.18.6"
lz4_flex = "0.14.0"
num_cpus = "1.17.0"
png = "0.18.1"
ratatui = { version = "0.30.2", optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssimulacra2 = { version = "0.5.1", optional = true }
# 缓存的溢写文件要匿名（Unix 上 unlink，Windows 上 delete-on-close），
# 中断时才不留下孤儿。集成测试也拿它建工作区。
tempfile = "3.24.0"
thiserror = "2.0.20"
toml = "1.1.4"
# 折行要按**显示宽度**算（`src/wrap.rs`），而中文一个字占两格。这一条**不是新的一棵树**：
# indicatif 与 ratatui 都传递依赖着同一个版本，直接列出来只是把它变成本仓库自己说得出口的
# 一条依赖——折行工具在 `tui` 之外，不能靠终端库那一份。
unicode-width = "0.2.2"
walkdir = "2.5.0"
zip = "8"

# 介质探测在 Windows 上要问存储栈本身有没有寻道惩罚（ADR 0009：介质按路径探测），
# 而那条路只有 DeviceIoControl 走得通。Linux 那一侧靠 sysfs，纯 std 就够，不必再引一个包。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
] }

[features]
default = ["tui"]
# 分阶段耗时剖面（加固批 13 号票的量具）。默认不在，口径与用法见 `src/cost.rs`。
profiling = []
ssimulacra2 = ["dep:ssimulacra2"]
tui = ["dep:ratatui"]

# 真实素材冒烟自带 harness，只为把「本次没跑」说得出口。理由见 `tests/smoke.rs` 的模块文档。
[[test]]
name = "smoke"
harness = false

[dev-dependencies]
# 夹具要按字节手搓 ZIP——`zip` 的写入端只收 Rust 字符串，编不出 GBK 成员名，
# 也置不出「没有 UTF-8 标志」这个恰恰要测的状态。
crc32fast = "1.5.1"
# 夹具生成器要写出 AVIF；`avif` 是编码侧特性（ravif），与运行时解码用的 avif-native 不同。
# resolver v2 不把 dev-dependencies 的特性并进非 dev 构建，`cargo build` 不会带上 ravif。
# 这一行**不是**冗余的重列：夹具也要 `encoding_rs` 与 `zip`，而那两个只列在 `[dependencies]` 里
# 就够——非可选项对 `tests/` 那些独立 crate 同样可见（`tests/concurrency.rs` 就直接用着
# 只列在那边的 `num_cpus`）。`image` 不同：dev 侧要的 `avif` 编码特性运行时那一份没有。
image = { version = "0.25.9", default-features = false, features = ["avif"] }
