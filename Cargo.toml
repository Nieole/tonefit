[package]
name = "tonefit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
# 命令行那两处折行要**问终端真有多宽**（`src/wrap.rs` 的 `terminal_width`）：std 答得出
# 「是不是终端」，答不出「有多宽」。这一条**不是新的一棵树**：indicatif 的进度条本来就
# 传递依赖着同一个版本、同一组特性（`default-features = false` 加 `std`），直接列出来
# 只是把它变成本仓库自己说得出口的一条依赖——与底下 `unicode-width` 那一条同一个道理。
# 探宽度的活不能交给 ratatui：那一份挂在 `tui` 特性后面，而闸门的第二条把 `tui` 关掉，
# 命令行那两处照旧要问。
console = { version = "0.16.4", default-features = false, features = ["std"] }
encoding_rs = "0.8.35"
fast_image_resize = "6"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp", "rayon", "avif-native"] }
indicatif = "0.18.6"
lz4_flex = "0.14.0"
num_cpus = "1.17.0"
png = "0.18.1"
ratatui = { version = "0.30.2", optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `.7z` 取纯 Rust 实现（ADR 0015），点名的是这一个：原 `sevenz-rust` 已停更，
# 它是接手的那一支，同一个 Apache-2.0，作者也是底下 `lzma-rust2` 的作者。
# 整份实现**一个 `unsafe` 都没有**，而 `zip 8` 早已把它要的那几个解码器
# （`lzma-rust2`、`bzip2`、`ppmd-rust`、`zstd`）拉进树里——收下它只多两个包。
# 选型的完整理由在 `.scratch/volume-discovery/issues/05-sevenzip.md` 的《落地记录》。
#
# **默认特性全关，只留解码那一半**：`compress` 是写 7z 的那一半，而输出一律 `.cbz`
# （ADR 0015 决定第 2 条），永远用不上；`aes256` 是带口令的包，而本工具没有问口令的地方；
# 留下的四个是 LZMA/LZMA2 之外真在流通的编码方式，各自那个包已经在树里，收下它们不多一个包。
# 夹具那一侧另要 `compress`——它要写得出 7z 才造得出用例，见 `[dev-dependencies]`。
sevenz-rust2 = { version = "0.22.2", default-features = false, features = ["bzip2", "deflate", "ppmd", "zstd"] }
ssimulacra2 = { version = "0.5.1", optional = true }
# 缓存的溢写文件要匿名（Unix 上 unlink，Windows 上 delete-on-close），
# 中断时才不留下孤儿。固实归档**摊开**的那个临时目录也是它建的（ADR 0015），
# 落在同一个系统临时目录下，磁盘那一侧因此照旧没有第二个旋钮；那一份不能匿名
# （成员要按名字读回来），靠析构收——差别写在 `source::Extraction` 上。
# 集成测试也拿它建工作区。
tempfile = "3.24.0"
thiserror = "2.0.20"
toml = "1.1.4"
# `.rar` 只能走 UnRAR 那份 C++ 源码：ADR 0015 把它单独成篇，正是因为 UnRAR 许可禁止据其
# 反推解压算法——一个纯 Rust 的 rar 解码器要么是那件被禁的事，要么许可说不清楚。
# 点名的是这一个：原 `unrar`（`muja`）停在 2025-02，`unrar-ng` 是接手的那一支，随的 UnRAR
# 新得多，另外补了一条**一趟顺序扫**的批量入口（原来那份逐个成员各搜一遍块头，
# 成员一多就是白付的 O(N²)）。选型的完整理由在
# `.scratch/volume-discovery/issues/06-rar.md` 的《落地记录》。
#
# **随二进制分发的那份许可要留字**，两处都要：`THIRD-PARTY-NOTICES.md` 的《UnRAR》一节
# （随的是哪一版 UnRAR 也只在那里说）与 `licenses/UnRAR.txt`。这一条与 `sevenz-rust2`
# 不同——那边是 Apache-2.0，走的是与仓库其余依赖同一条路。
#
# **默认特性全关**：那个默认特性管的是 `extract_all` 在 Linux 上写盘时的文件名编码，
# 而本仓不走它——摊开这一层的落盘自己做（`source::write_extracted_member`），
# 成员字节从 `read()` 出来就是一个 `Vec<u8>`，libunrar 一处路径都不碰。
# （它省不掉 `libc`：那是 `unrar-ng-sys` 的非可选依赖，而树里本来就有一份。）
unrar-ng = { version = "0.7.7", default-features = false }
# 折行要按**显示宽度**算（`src/wrap.rs`），而中文一个字占两格。这一条**不是新的一棵树**：
# indicatif 与 ratatui 都传递依赖着同一个版本，直接列出来只是把它变成本仓库自己说得出口的
# 一条依赖——折行工具在 `tui` 之外，不能靠终端库那一份。
unicode-width = "0.2.2"
zip = "8"

# 介质探测在 Windows 上要问存储栈本身有没有寻道惩罚（ADR 0009：介质按路径探测），
# 而那条路只有 DeviceIoControl 走得通。Linux 那一侧靠 sysfs，纯 std 就够，不必再引一个包。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
] }

[features]
default = ["tui"]
# 分阶段耗时剖面（加固批 13 号票的量具）。默认不在，口径与用法见 `src/cost.rs`。
profiling = []
ssimulacra2 = ["dep:ssimulacra2"]
tui = ["dep:ratatui"]

# 真实素材冒烟自带 harness，只为把「本次没跑」说得出口。理由见 `tests/smoke.rs` 的模块文档。
[[test]]
name = "smoke"
harness = false

[dev-dependencies]
# 夹具要按字节手搓 ZIP——`zip` 的写入端只收 Rust 字符串，编不出 GBK 成员名，
# 也置不出「没有 UTF-8 标志」这个恰恰要测的状态。
crc32fast = "1.5.1"
# 夹具生成器要写出 AVIF；`avif` 是编码侧特性（ravif），与运行时解码用的 avif-native 不同。
# resolver v2 不把 dev-dependencies 的特性并进非 dev 构建，`cargo build` 不会带上 ravif。
# 这一行**不是**冗余的重列：夹具也要 `encoding_rs` 与 `zip`，而那两个只列在 `[dependencies]` 里
# 就够——非可选项对 `tests/` 那些独立 crate 同样可见（`tests/concurrency.rs` 就直接用着
# 只列在那边的 `num_cpus`）。`image` 不同：dev 侧要的 `avif` 编码特性运行时那一份没有。
image = { version = "0.25.9", default-features = false, features = ["avif"] }
# 夹具要**写得出** 7z 才造得出 `.7z` 的用例，而运行时那一份只解不压（见 `[dependencies]`）。
# 与上面 `image` 那一行同一条道理、同一条依据：resolver v2 不把 dev-dependencies 的特性
# 并进非 dev 构建，`cargo build` 因此不会带上 7z 的编码器。
sevenz-rust2 = { version = "0.22.2", default-features = false, features = ["compress"] }
# 铺平一棵树、答「这个容器里装着什么」——只有断言用得着。库这一侧从 ADR 0014 起
# 不再递归遍历任何东西：目录卷只列直接那一层，发现自己走一个显式的栈（`src/discover.rs`）。
walkdir = "2.5.0"
