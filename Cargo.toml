[package]
name = "tonefit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
encoding_rs = "0.8.35"
fast_image_resize = "6"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp", "rayon", "avif-native"] }
indicatif = "0.18.6"
lz4_flex = "0.14.0"
num_cpus = "1.17.0"
png = "0.18.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssimulacra2 = { version = "0.5.1", optional = true }
# 缓存的溢写文件要匿名（Unix 上 unlink，Windows 上 delete-on-close），
# 中断时才不留下孤儿。集成测试也拿它建工作区。
tempfile = "3.24.0"
thiserror = "2.0.20"
toml = "1.1.4"
walkdir = "2.5.0"
zip = "8"

# 介质探测在 Windows 上要问存储栈本身有没有寻道惩罚（ADR 0009：介质按路径探测），
# 而那条路只有 DeviceIoControl 走得通。Linux 那一侧靠 sysfs，纯 std 就够，不必再引一个包。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
] }

[features]
ssimulacra2 = ["dep:ssimulacra2"]

[dev-dependencies]
# 夹具要按字节手搓 ZIP——`zip` 的写入端只收 Rust 字符串，编不出 GBK 成员名，
# 也置不出「没有 UTF-8 标志」这个恰恰要测的状态。
crc32fast = "1.5.1"
# 夹具要按 GBK 编成员名，测试要绕开被测代码读回归档。集成测试是独立的 crate，
# 拿不到本包的普通依赖，因此这两个在两处各列一次。
encoding_rs = "0.8.35"
# 夹具生成器要写出 AVIF；`avif` 是编码侧特性（ravif），与运行时解码用的 avif-native 不同。
# resolver v2 不把 dev-dependencies 的特性并进非 dev 构建，`cargo build` 不会带上 ravif。
image = { version = "0.25.9", default-features = false, features = ["avif"] }
zip = "8"
